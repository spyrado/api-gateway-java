spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1
